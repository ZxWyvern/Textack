[project]
name = "textack"
version = "1.0.00"
description = "typing = damage — siege the fortress"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["textack*"]

[tool.ruff]
target-version = "py39"
line-length = 110
